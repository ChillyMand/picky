<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7e7">
  <title>你到底有多挑食？</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="screen home-screen" data-screen="home">
      <header class="mini-nav"><span class="brand">PICKY<span>!</span></span><span class="time-pill">约 2 分钟</span></header>
      <div class="hero-food" aria-hidden="true"><span>🍙</span><b>饭碗安检</b></div>
      <p class="eyebrow">THE PICKY EATER TEST</p>
      <h1>你到底<br><mark>有多挑食？</mark></h1>
      <p class="lead">回答一组食材选择题，测出你的挑食指数和饭桌人格。</p>
      <div class="feature-stickers"><span>约 2 分钟</span><span>有点毒舌</span><span>饭桌人格卡</span></div>
      <button class="primary-button" data-action="show-intro">开始检查我的饭碗 <span>→</span></button>
      <div class="choice-preview" aria-label="答题选项预览"><span>😋 超爱吃</span><span>🙂 可以吃</span><span>😖 坚决不吃</span><span>❓ 没吃过</span></div>
    </section>
  </main>
  <noscript>请开启 JavaScript 后开始测试。</noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
