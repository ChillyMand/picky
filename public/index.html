<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7e7">
  <link rel="icon" type="image/png" href="/assets/picky-logo.png">
  <title>你到底有多挑食？</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/pair.css">
  <link rel="stylesheet" href="/direct-match.css">
  <link rel="stylesheet" href="/touch-fixes.css?v=2">
  <link rel="stylesheet" href="/intro-compact.css?v=3">
  <link rel="stylesheet" href="/share-preview.css?v=1">
  <link rel="stylesheet" href="/brand.css?v=4">
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="screen home-screen" data-screen="home">
      <header class="mini-nav"><span class="brand-lockup"><img src="/assets/picky-logo.png" alt=""><span class="brand-word">PICKY<span class="brand-bang">!</span></span></span><span class="time-pill">约 5 分钟</span></header>
      <div class="hero-food" aria-hidden="true"><img src="/assets/picky-logo.png" alt=""><b>饭碗安检</b></div>
      <p class="eyebrow">THE PICKY EATER TEST</p>
      <h1>你到底<br><mark>有多挑食？</mark></h1>
      <p class="lead">回答一组食材选择题，测出你的挑食指数和饭桌人格。</p>
      <div class="feature-stickers"><span>45+ 种食材</span><span>有点毒舌</span><span>饭桌人格卡</span></div>
      <button class="primary-button" data-action="show-intro">开始检查我的饭碗 <span>→</span></button>
      <div class="pair-entry"><b>已有好友的 4 位配对码？</b><div><input id="pair-code-input" maxlength="4" autocomplete="off" placeholder="输入好友配对码" aria-label="输入好友配对码"><button data-action="join-pair">开始双人匹配</button></div></div>
      <div class="pair-entry direct-match"><b>双方都测完了？直接查看匹配度</b><div class="code-pair"><input id="first-match-code" maxlength="4" autocomplete="off" placeholder="我的配对码" aria-label="我的配对码"><input id="second-match-code" maxlength="4" autocomplete="off" placeholder="对方配对码" aria-label="对方配对码"></div><button data-action="lookup-match">查看匹配度</button></div>
      <div class="choice-preview" aria-label="答题选项预览"><span>😋 超爱吃</span><span>🙂 可以吃</span><span>😖 坚决不吃</span><span>❓ 没吃过</span></div>
    </section>
  </main>
  <footer class="site-footer">COPYRIGHT © 2026 WZRICE.CN · ALL RIGHTS RESERVED</footer>
  <noscript>请开启 JavaScript 后开始测试。</noscript>
  <script type="module" src="/app.js?v=flow5"></script>
</body>
</html>
